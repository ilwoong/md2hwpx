# 웹 서비스: docker compose up -d --build 후 http://localhost:8000
services:
  web:
    build:
      context: .
      target: web
    image: md2hwpx-web
    ports:
      - "8000:8000"
    # GitLab·Gitea 로그인 설정 (.env.example 참고). 없으면 로그인 없이 실행한다.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
