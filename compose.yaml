# 웹 서비스: docker compose up -d --build 후 http://localhost:8000
services:
  web:
    build:
      context: .
      target: web
    image: md2hwpx-web
    ports:
      - "8000:8000"
    # GitLab·Gitea 로그인 설정 (.env.example 참고). 없으면 로그인 없이 실행한다.
    env_file:
      - path: .env
        required: false
    # 요청마다 만드는 임시 폴더(올린 파일·zip·git 저장소)가 메모리에만 있게 한다.
    # 변환 중에 프로세스가 강제로 끝나도, 컨테이너가 다시 시작되면 남지 않는다.
    tmpfs:
      - /tmp
    restart: unless-stopped
