[project]
name = "md2hwpx"
version = "0.1.0"
description = "Convert Markdown to HWPX"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "python-hwpx>=6.10.0",
]

[project.scripts]
md2hwpx = "md2hwpx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
